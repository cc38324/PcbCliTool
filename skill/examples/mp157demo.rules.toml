# MP157Demo: rules of route / drc / check (easyedatool … --rules rules/mp157demo.rules.toml)
# 保留 ST 核心器件布局与高速信号走线；电源铜已统一检查并加粗，完成版从 layout 恢复。
grid = 0.05
search_budget_scale = 8
clearance = 0.1
track = 0.1
power_track = 0.6
power_min_run = 1.0
via_diameter = 0.4
via_drill = 0.2
via_spacing = 0.6
edge = 0.4
# more rip-up rounds: each attempt keeps its best round (16: 527 against 525 with 8 on the old placement)
rip_passes = 16
# a net may be ripped this often per attempt (8: FDCAN1_RX was left blocked by VDD_DDR, ripped 8 times): 529 -> 532
rip_max = 16
# one more whole round with the unrouted first (the three more of the default gave nothing on this board, 22 min)
restarts = 1
# signals on inner 2 too (the 3V3 pour fills round them; ST's power islands there stay whole, vias pass them);
# inner 1 is the GND reference plane; the saved layout also retains one 15 mm local PA10 connection.
# The autorouter does not add further tracks on inner 1.
layers = ["top", "inner2", "bottom"]

[nets]
# the other nets ST joins through copper areas (inner-2 islands, switch nodes) the router joins the same way
pour = ["GND", "3V3"]
power = ["3V3", "5V_VIN", "GND", "LCD_1V8", "NetC43_2", "NetC68_2", "NetC69_2", "NetC70_2", "NetC82_2", "NetL1_1", "NetL2_1", "NetL3_1", "NetL4_1", "NetL5_1", "NetR43_1", "OLED_BOOT", "OLED_SW", "OLED_VBAT", "OLED_VCI_EN", "PHY_VDDCR", "TP_2V8", "VBUS_HOST", "VDD", "VDDA", "VDDA_1V8", "VDDA_PHY", "VDD_CORE", "VDD_DDR", "VDD_USB", "VREF+", "VREF_DDR", "VTT_DDR", "WL_LDO_SW", "WL_VIN_LDO"]
keep = ["*"]
# the long lines across the board first (USB, CAN, the debug UART, RS485): they take the clear ways
first = ["FDCAN1_RX", "PA10", "WL_LPO", "USBH_DP", "USBH_DM", "OTG_DP", "OTG_DM", "FDCAN1_TX", "UART4_TX", "UART4_RX", "USART3_TX", "USART3_RX", "RS485_DE"]

[check]
allow_outside = ["J1", "J2", "J3"]
# the placement review leaves ST's parts (AN5122, one- and two-digit designators) where ST has them: the DDR's
# terminations at the end of their lines, the PMIC's parts by its pins
layout_skip = ["R?", "R??", "C?", "C??", "L?", "U?"]

[drc.quality]
# 从 0.1 mm 起逐档查实际线宽，覆盖 0.2 / 0.3 mm 分支和更粗主干；跨焊盘、过孔，最短报告长度 0.1 mm。
width_neck = 0.1
width_neck_min_length = 0.1
width_neck_through_contacts = true
width_neck_nets = ["3V3", "5V_VIN", "GND", "LCD_1V8", "NetC43_2", "NetC68_2", "NetC69_2", "NetC70_2", "NetC82_2", "NetL1_1", "NetL2_1", "NetL3_1", "NetL4_1", "NetL5_1", "NetR43_1", "OLED_BOOT", "OLED_SW", "OLED_VBAT", "OLED_VCI_EN", "PHY_VDDCR", "TP_2V8", "VBUS_HOST", "VDD", "VDDA", "VDDA_1V8", "VDDA_PHY", "VDD_CORE", "VDD_DDR", "VDD_USB", "VREF+", "VREF_DDR", "VTT_DDR", "WL_LDO_SW", "WL_VIN_LDO"]
