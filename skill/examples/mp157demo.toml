# Generated by tools/gen_design.py — edit that, not this file.
[project]
name = "MP157Demo"
time = "2026-10-03 12:00:00"

[board]
outline = [[0, 0], [100, 0], [100, 80], [0, 80]]
layers = 4
# ST's stack-up (its Altium file): 3.88 mil prepreg of Dk 4.1 under the outer layers, which ST's DDR routes (0.12 mm
# data, 0.1 / 0.13 mm pairs) are drawn for; JLC's 3313 one is the same (0.0994 mm, Dk 4.1). On it 100 ohm pairs are
# 0.15 / 0.15 mm, 90 ohm 0.18 / 0.15
stackup = "JLC04161H-3313"

# parts given no angle turned to their shortest ratsnest (a transceiver's bus pins to its connector); surface-
# mount parts on the bottom 5 mm from through-hole pins (the wave pallet's cut-out)
[placement]
orient = true
# small parts given no position by the pins they serve (a termination between its bus pins, a pull-up by its pin)
near = true
tht_smd = 5.0

[schematic]
# A3 frames: the MPU's power pins and the DDR with their capacitors are more than an A4 holds
size = "A3"
ground = ["GND"]
power = ["VDD", "VDD_CORE", "VDD_DDR", "3V3", "5V_VIN", "VTT_DDR", "VREF_DDR", "VDD_USB", "VDDA", "VDDA_PHY", "VBUS_HOST", "VREF+", "VDDA_1V8"]

# ST's rules of the AN5122 board (its Altium file): 0.09 mm tracks, 0.4 / 0.2 mm vias; 0.1 mm clearance, 0.09 mm
# where it is built so (between the eMMC's balls; JLC's 4-layer minimum is 3.5 mil)
[rules]
clearance = 0.09
track = 0.09
via = [0.4, 0.2]
hole_to_hole = 0.25
# pours 0.15 mm off other copper (EasyEDA's 0.254 fills the PMIC's switch-node islands between its 0.4 mm pins
# to nothing)
pour = 0.15
# ST's copper islands join their pads directly (the PMIC's switch nodes are hardly bigger than the pads: thermal
# reliefs left nothing of them)
direct = ["NetL*_1", "5V_VIN", "VTT_DDR"]

[designators]
font = 0.6
stroke = 0.1

