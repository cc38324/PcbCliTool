[[reuse]]
from = "../build/st/board.PcbDoc"
parts = ["C1", "C10", "C11", "C12", "C13", "C14", "C15", "C16", "C17", "C18", "C19", "C2", "C20", "C21", "C22", "C23", "C24", "C25", "C26", "C27", "C28", "C29", "C3", "C30", "C31", "C32", "C33", "C34", "C35", "C36", "C37", "C38", "C39", "C4", "C40", "C41", "C42", "C43", "C44", "C45", "C46", "C47", "C48", "C49", "C5", "C50", "C51", "C52", "C53", "C54", "C55", "C56", "C57", "C58", "C59", "C6", "C60", "C61", "C62", "C63", "C64", "C65", "C66", "C68", "C7", "C70", "C73", "C74", "C75", "C76", "C77", "C78", "C79", "C8", "C80", "C81", "C82", "C83", "C84", "C85", "C86", "C87", "C88", "C89", "C9", "C90", "C91", "C92", "C93", "C94", "C95", "C96", "C97", "L1", "L2", "L3", "L4", "L5", "R1", "R10", "R11", "R12", "R13", "R14", "R15", "R16", "R17", "R18", "R19", "R2", "R20", "R21", "R22", "R23", "R24", "R25", "R26", "R27", "R28", "R29", "R3", "R30", "R37", "R38", "R39", "R4", "R40", "R41", "R43", "R5", "R6", "R7", "R8", "R9", "U1", "U2", "U4", "U5"]
move = [101, 1]
turn = 90
skip_nets = ["NetB1_3", "I2C4_*", "NRST", "PWR_ON", "PA0_WKUP"]
# ST's south strip (under its MPU and DDR) fences our MPU's peripheral side: there only the DDR's and the eMMC's
# routes come over, the power, I2C and ground tracks around the MPU are routed again; so are they in the strips
# right outside the MPU's east and west balls where our USB, CAN, header and WiFi lines leave
local = [[4.0, 54.0, 31.5, 99.0], [39.5, 54.0, 68.0, 99.0], [31.5, 55.3, 31.6, 99.0], [35.4, 55.3, 39.5, 99.0], [31.6, 55.3, 35.4, 70.06], [31.6, 73.0, 35.4, 99.0]]
routes = ["DDR_*", "NetR26*", "NetR27*", "VTT_DDR", "SDMMC2_*"]
copper = [[4.0, 46.0, 68.0, 99.0]]
# ST's I2C4 between its PMIC and the pull-ups R37 / R38 (skipped above with the rest of I2C4) copied as the PMIC's
# I2C: around the PMIC's pins it is the only way in
copy_as = [{ rect = [4.0, 73.0, 24.0, 99.0], nets = { I2C4_SDA = "PMIC_SDA", I2C4_SCL = "PMIC_SCL" } }]
# a ball's dogbone taken to its neighbour's via (ST_MOVES)
moves = [{ from = [36.4, 55.9], to = [35.6, 56.7] }]
tolerance = 0.25
stitching = false

